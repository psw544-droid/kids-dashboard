<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미리보기 · 390×844</title>
<style>
  html,body{ margin:0; background:#e8f1fa; font:13px/1.4 system-ui, sans-serif; }
  #phone{ position:absolute; left:0; top:0; width:390px; height:844px; border:0; display:block; background:#fff; }
  #log{ position:absolute; left:404px; top:8px; right:8px; font:12px/1.45 monospace; color:#b23; white-space:pre-wrap; }
</style>
</head>
<body>
<iframe id="phone" src="./index.html"></iframe>
<div id="log">errors: (loading)</div>
<script>
  var f = document.getElementById('phone');
  var log = document.getElementById('log');
  var errs = [];
  window.__errs = errs;
  function show() { log.textContent = errs.length ? errs.join('\n') : 'errors: none'; }
  function hook() {
    try {
      var w = f.contentWindow;
      w.addEventListener('error', function (e) {
        errs.push(e.message + ' @' + String(e.filename || '').split('/').slice(-1) + ':' + e.lineno);
        show();
      });
      w.addEventListener('unhandledrejection', function (e) {
        errs.push('promise: ' + ((e.reason && e.reason.message) || e.reason));
        show();
      });
    } catch (e) { errs.push('hook fail ' + e); }
    show();
  }
  f.addEventListener('load', hook);
  setTimeout(hook, 1200);
</script>
</body>
</html>
